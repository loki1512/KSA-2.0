<!DOCTYPE html>
<html lang="en">
<head>

<title>Manhatten Industries | Product Return</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/static/css/billing.css">
<link rel="stylesheet" href="/static/css/returns.css">

</head>

<body>

<header class="site-header">

<div class="header-left">
<div class="logo-mark">KSA</div>
<div>
<h1>Manhatten Industries</h1>
<span class="header-sub">Product Return</span>
</div>
</div>

<nav class="header-nav">
<a href="/">Dashboard</a>
<a href="/billing">+ New Bill</a>
<a href="/customers">Customers</a>
<a href="/transactions">Transactions</a>
<a href="/logout" style="color:#dc2626;">Logout</a>
</nav>

</header>



<main class="container">

<!-- CUSTOMER CARD -->

<div class="card customer-card">

<div class="card-header">
<h2>Customer</h2>
</div>

<div class="locked-customer">

<div class="cust-avatar" id="custAvatar"></div>

<div class="cust-info">

<div class="cust-name" id="custName">Loading...</div>

<div class="cust-meta">

<span id="custPhone"></span>

<span id="custVillage"></span>

</div>

</div>

</div>

</div>



<!-- ITEM ENTRY -->

<div class="card item-card">

<div class="card-header">
<h2>Add Return Item</h2>
</div>

<div class="search-wrap">

<label>Item Name</label>

<div class="search-input-wrap">

<span class="search-icon">🔍</span>

<input
type="text"
id="itemName"
placeholder="Search item..."
autocomplete="off"
/>

</div>

<div id="suggestions" class="suggestions-dropdown" style="display:none;">
<div id="suggestionList"></div>
</div>

</div>



<div class="field-row">

<div class="field-group">

<label>Quantity</label>

<input id="qty" type="number" value="1" min="0.01" step="0.01">

</div>

<div class="field-group">

<label>Refund Price (₹)</label>

<input id="price" type="number" min="0" step="0.01">

</div>

</div>


<button class="btn btn-primary btn-add" onclick="addItem()">
+ Add Return Item
</button>

</div>



<!-- RETURN TABLE -->

<div class="card table-card" id="tableCard" style="display:none;">

<div class="card-header">
<h2>Return Items</h2>
</div>

<div class="table-scroll">

<table>

<thead>
<tr>
<th>#</th>
<th>Item</th>
<th class="num">Price</th>
<th class="num">Qty</th>
<th class="num">Refund</th>
<th></th>
</tr>
</thead>

<tbody id="itemsBody"></tbody>

</table>

</div>


<div class="subtotal-row">

<span>Total Refund</span>

<span class="subtotal-val">
₹ <span id="subtotal">0.00</span>
</span>

</div>

</div>



<div class="action-bar" id="finaliseBar" style="display:none;">

<button class="btn btn-success btn-lg" onclick="saveReturn()">
Save Return
</button>

</div>


</main>



<div id="toast" class="toast" style="display:none;"></div>


<script src="/static/js/returns.js"></script>

</body>
</html>
