<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Account - Kumara Swami Agencies</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/css/my_account.css">
  <link rel="icon" type="image/png" href="/static/images/head-logo.png">
</head>
<body>

  <header class="pub-header">
    <div class="pub-logo"><img src="/static/images/head-logo.png" alt="KSA logo"></div>
    <div>
      <div class="pub-brand">Kumara Swami Agencies</div>
      <div class="pub-sub">Near SBI ATM, Ravindra Nagar, Galiveedu</div>
    </div>
  </header>

  <main class="pub-container">
    <div id="loadingSection" class="pub-card lookup-card">
      <h2>Loading Your Account</h2>
      <p class="lookup-hint">Fetching your latest ledger and balance.</p>
      <p id="lookupError" class="lookup-error" style="display:none;"></p>
    </div>

    <div id="accountSection" style="display:none;">
      <div class="pub-card profile-summary">
        <div class="prof-avatar" id="profAvatar"></div>
        <div class="prof-details">
          <div class="prof-name" id="profName"></div>
          <div class="prof-phone" id="profPhone"></div>
          <div class="prof-phone" id="profEmail"></div>
        </div>
        <a class="btn-logout" href="/logout">Logout</a>
      </div>

      <div class="pub-balance-grid">
        <div class="pub-bal-card pub-bal-ledger">
          <div class="pub-bal-label">Outstanding Balance</div>
          <div class="pub-bal-value" id="pubLedgerBal">Rs.0.00</div>
          <div class="pub-bal-hint" id="pubLedgerHint"></div>
        </div>
        <div class="pub-bal-card pub-bal-wallet">
          <div class="pub-bal-label">Store Credit / Wallet</div>
          <div class="pub-bal-value" id="pubWalletBal">Rs.0.00</div>
        </div>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="transactions">Transaction History</button>
        <button class="tab-btn" data-tab="offers">Special Offers</button>
      </div>

      <div id="transactions-tab" class="tab-content">
        <div class="pub-card txn-card">
          <h3>Transaction History</h3>
          <div class="txn-list" id="txnList"></div>
        </div>
      </div>

      <div id="offers-tab" class="tab-content" style="display: none;">
        <div class="pub-card offers-card">
          <h3>Special Offers</h3>
          <div id="offersList">Loading offers...</div>
        </div>
      </div>
    </div>
  </main>

  <footer class="pub-footer">
    <p>Phone: 9490608943 | Kumara Swami Agencies</p>
  </footer>

<script src="/static/js/my_account.js"></script>
</body>
</html>
