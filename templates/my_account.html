<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Account — Kumara Swami Agencies</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/css/my_account.css">
</head>
<body>

  <header class="pub-header">
    <div class="pub-logo">KSA</div>
    <div>
      <div class="pub-brand">Kumara Swami Agencies</div>
      <div class="pub-sub">Near SBI ATM, Ravindra Nagar, Galiveedu</div>
    </div>
  </header>

  <main class="pub-container">

    <!-- LOOKUP FORM -->
    <div id="lookupSection">
      <div class="pub-card lookup-card">
        <div class="lookup-icon">📱</div>
        <h2>View Your Account</h2>
        <p class="lookup-hint">Enter your registered mobile number to see your transactions and balance.</p>

        <div class="lookup-field">
          <input type="tel" id="phoneInput" maxlength="10"
            placeholder="10-digit mobile number"
            inputmode="numeric" autocomplete="tel">
          <button id="lookupBtn" onclick="lookupAccount()">View Account →</button>
        </div>
        <p id="lookupError" class="lookup-error" style="display:none;"></p>
      </div>
    </div>

    <!-- ACCOUNT VIEW (hidden until lookup) -->
    <div id="accountSection" style="display:none;">

      <!-- Profile summary -->
      <div class="pub-card profile-summary">
        <div class="prof-avatar" id="profAvatar"></div>
        <div class="prof-details">
          <div class="prof-name" id="profName"></div>
          <div class="prof-phone" id="profPhone"></div>
        </div>
        <button class="btn-logout" onclick="logout()">← Change Number</button>
      </div>

      <!-- Balance cards -->
      <div class="pub-balance-grid">
        <div class="pub-bal-card pub-bal-ledger">
          <div class="pub-bal-label">Outstanding Balance</div>
          <div class="pub-bal-value" id="pubLedgerBal">₹0.00</div>
          <div class="pub-bal-hint" id="pubLedgerHint"></div>
        </div>
        <div class="pub-bal-card pub-bal-wallet">
          <div class="pub-bal-label">Store Credit / Wallet</div>
          <div class="pub-bal-value" id="pubWalletBal">₹0.00</div>
        </div>
      </div>

      <!-- Transactions -->
      <div class="pub-card txn-card">
        <h3>Transaction History</h3>
        <div class="txn-list" id="txnList"></div>
      </div>

    </div>

  </main>

  <footer class="pub-footer">
    <p>📞 9490608943 &nbsp;|&nbsp; Kumara Swami Agencies, </p>
  </footer>

<script src="/static/js/my_account.js"></script>
</body>
</html>
