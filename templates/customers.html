<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Customers - KSA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/css/bills.css">
  <link rel="stylesheet" href="/static/css/customers.css">
  <link rel="stylesheet" href="/static/css/app_shell.css">
  <link rel="icon" type="image/png" href="/static/images/head-logo.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div class="page">

  <header class="site-header">
    <div class="header-left">
      <div class="logo-mark"><img src="/static/images/head-logo.png" alt="KSA logo"></div>
      <div>
        <h1>Kumara Swami Agencies</h1>
        <span class="header-sub">Smart billing system</span>
      </div>
    </div>
    <nav class="header-nav">
      <a href="/">Dashboard</a>
      <a href="/billing">+ New Bill</a>
      <a href="/catalog">Catalog</a>
      <a href="/bills">Bills</a>
      <a href="/customers" class="active">Customers</a>
      <a href="/transactions">Transactions</a>
      <a href="/returns/new">Returns</a>
      <a href="/logout" class="nav-logout">Logout</a>
    </nav>
  </header>

  <div class="page-header customer-page-header">
    <div class="page-header-content">
      <p class="page-kicker">Customer Directory</p>
      <h2 class="page-title">Customers</h2>
      <p class="page-summary">Sort, filter, export, and open individual ledgers without leaving the customer list.</p>
    </div>
    <div class="page-header-actions page-actions">
      <a class="back-link" href="/">Dashboard</a>
      <button class="btn-export" onclick="exportCustomers()">Export Excel</button>
      <button class="btn-reset" type="button" onclick="resetToTop()">Reset</button>
    </div>
  </div>

  <div class="mode-banner" id="modeBanner" style="display:none;">
    <span id="modeText"></span>
    <button class="link-btn" onclick="resetToTop()">&larr; Back to Top 200</button>
  </div>

  <div class="table-card">
    <div class="table-toolbar">
      <input
        type="text"
        id="customerSearch"
        class="customer-search-input"
        placeholder="Search name, phone, village, type... (searches all customers)"
        aria-label="Search customers"
      >
    </div>

    <table class="bills-table">
      <thead>
        <tr class="heading-row">
          <th>#</th>
          <th>
            <button type="button" class="sort-button" data-sort-key="name">
              <span>Name</span>
              <span class="sort-indicator" aria-hidden="true"></span>
            </button>
          </th>
          <th>
            <button type="button" class="sort-button" data-sort-key="phone">
              <span>Phone</span>
              <span class="sort-indicator" aria-hidden="true"></span>
            </button>
          </th>
          <th>
            <button type="button" class="sort-button" data-sort-key="village">
              <span>Village</span>
              <span class="sort-indicator" aria-hidden="true"></span>
            </button>
          </th>
          <th>
            <button type="button" class="sort-button" data-sort-key="customer_type">
              <span>Type</span>
              <span class="sort-indicator" aria-hidden="true"></span>
            </button>
          </th>
          <th class="num">
            <button type="button" class="sort-button sort-button-num" data-sort-key="total_spent">
              <span>Total Spent</span>
              <span class="sort-indicator" aria-hidden="true"></span>
            </button>
          </th>
          <th class="num">
            <button type="button" class="sort-button sort-button-num" data-sort-key="bill_count">
              <span>Bills</span>
              <span class="sort-indicator" aria-hidden="true"></span>
            </button>
          </th>
          <th class="num">
            <button type="button" class="sort-button sort-button-num" data-sort-key="outstanding_balance">
              <span>Outstanding</span>
              <span class="sort-indicator" aria-hidden="true"></span>
            </button>
          </th>
          <th class="num">
            <button type="button" class="sort-button sort-button-num" data-sort-key="wallet_balance">
              <span>Wallet</span>
              <span class="sort-indicator" aria-hidden="true"></span>
            </button>
          </th>
          <th>Actions</th>
        </tr>
        <tr class="header-filters">
          <th></th>
          <th></th>
          <th></th>
          <th></th>
          <th>
            <select id="typeFilter" class="header-filter-control" aria-label="Filter customer type">
              <option value="">All Types</option>
              <option value="regular">Regular</option>
              <option value="premium">Premium</option>
              <option value="electrician">Electrician</option>
            </select>
          </th>
          <th></th>
          <th></th>
          <th>
            <select id="outstandingFilter" class="header-filter-control" aria-label="Filter outstanding balance">
              <option value="">All Balances</option>
              <option value="due">Due Only</option>
              <option value="settled">Settled</option>
              <option value="credit">Advance/Credit</option>
            </select>
          </th>
          <th></th>
          <th></th>
        </tr>
      </thead>
      <tbody id="customersBody"></tbody>
    </table>
  </div>

</div>

<script src="/static/js/customers.js"></script>
</body>
</html>
