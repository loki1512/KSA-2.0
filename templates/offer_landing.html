<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Offer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app_shell.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/offer.css') }}">
</head>
<body>
    <div class="container">
        <h1>Special Offer</h1>

        {% if error %}
            <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        {% if success %}
            <div class="alert alert-success">{{ success }}</div>
        {% endif %}

        {% if offer %}
            <div class="offer-card">
                <h2>{{ offer.product_name }}</h2>
                <p>{{ offer.offer_description }}</p>
                {% if offer.expiry_date %}
                    <p><strong>Expires:</strong> {{ offer.expiry_date.strftime('%Y-%m-%d %H:%M') }}</p>
                {% endif %}
            </div>

            <form method="POST" class="offer-form">
                <div class="form-group">
                    <label for="phone">Phone Number *</label>
                    <input type="tel" id="phone" name="phone" value="{{ phone }}" required>
                </div>

                <div class="form-group" id="name-group" style="display: none;">
                    <label for="name">Your Name *</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <button type="submit" class="btn btn-primary">I'm Interested!</button>
            </form>

            <script>
                document.getElementById('phone').addEventListener('input', function() {
                    const phone = this.value.trim();
                    const nameGroup = document.getElementById('name-group');
                    if (phone) {
                        fetch(`/api/customers/lookup?phone=${encodeURIComponent(phone)}`)
                            .then(response => response.json())
                            .then(data => {
                                if (data.exists) {
                                    nameGroup.style.display = 'none';
                                    document.getElementById('name').required = false;
                                } else {
                                    nameGroup.style.display = 'block';
                                    document.getElementById('name').required = true;
                                }
                            })
                            .catch(() => {
                                nameGroup.style.display = 'block';
                                document.getElementById('name').required = true;
                            });
                    } else {
                        nameGroup.style.display = 'none';
                        document.getElementById('name').required = false;
                    }
                });
            </script>
        {% endif %}
    </div>
</body>
</html>
