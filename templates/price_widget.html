<!-- 
  DASHBOARD QUICK PRICE WIDGET
  Include this partial inside your dashboard template.
  Requires: /static/js/price_widget.js and /static/css/price_widget.css
-->

<div class="card price-widget-card" id="priceWidget">
  <div class="card-header">
    <h3>Quick Price Editor</h3>
    <span class="pwe-hint">For frequently changing items</span>
  </div>

  <!-- Search bar -->
  <div class="pwe-search-wrap">
    <span class="pwe-search-icon">🔍</span>
    <input type="text" id="pweSearch"
      placeholder="Search item to update price…"
      autocomplete="off">
    <div id="pweSuggestions" class="pwe-suggestions" style="display:none;"></div>
  </div>

  <!-- Active edit row (hidden until item selected) -->
  <div id="pweEditRow" class="pwe-edit-row" style="display:none;">
    <div class="pwe-item-name" id="pweItemName"></div>

    <div class="pwe-fields">
      <div class="pwe-field">
        <label>Default ₹</label>
        <input type="number" id="pweDefaultPrice" min="0" step="0.01" placeholder="0.00">
      </div>
      <div class="pwe-field">
        <label>Max ₹</label>
        <input type="number" id="pweMaxPrice" min="0" step="0.01" placeholder="0.00">
      </div>
      <div class="pwe-field">
        <label>Final ₹</label>
        <input type="number" id="pweFinalPrice" min="0" step="0.01" placeholder="0.00">
      </div>
      <button class="pwe-save-btn" id="pweSaveBtn" onclick="pweSave()">Update</button>
    </div>

    <div class="pwe-status" id="pweStatus"></div>
  </div>

  <!-- Recent edits list -->
  <div id="pweRecentList" class="pwe-recent"></div>
</div>
