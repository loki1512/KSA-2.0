<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Transactions — KSA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/css/bills.css">
  <link rel="stylesheet" href="/static/css/transactions.css">
  <link rel="stylesheet" href="/static/css/app_shell.css">
  <link rel="icon" type="image/png" href="/static/images/head-logo.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div class="page">

  <header class="site-header">
    <div class="header-left">
      <div class="logo-mark"><img src="/static/images/head-logo.png" alt="KSA logo"></div>
      <div>
        <h1>Kumara Swami Agencies</h1>
        <span class="header-sub">Smart billing system</span>
      </div>
    </div>
    <nav class="header-nav">
      <a href="/">Dashboard</a>
      <a href="/billing">+ New Bill</a>
      <a href="/catalog">Catalog</a>
      <a href="/bills">Bills</a>
      <a href="/customers">Customers</a>
      <a href="/transactions" class="active">Transactions</a>
      <a href="/returns/new">Returns</a>
      <a href="/admin/profile">Profile</a>
      <a href="/logout" class="nav-logout">Logout</a>
    </nav>
  </header>

  <div class="page-header">
    <a class="back-link" href="/">← Dashboard</a>
    <p class="page-kicker">Money Movement</p>
    <h2 class="page-title">All Transactions</h2>
    <p class="page-summary">Track sales, payments, refunds, and settlements in one unified ledger view.</p>
    <span class="total-badge" id="totalBadge">—</span>
  </div>

  <div class="filters-card">
    <input type="text" id="txnSearch" placeholder="Search customer name, phone, type…">
    <div class="date-filters">
      <div><label>Type</label>
        <select id="typeFilter">
          <option value="">All</option>
          <option value="SALE">Sale</option>
          <option value="PAYMENT">Payment</option>
          <option value="REFUND">Refund</option>
          <option value="SETTLEMENT">Settlement</option>
        </select>
      </div>
      <div class="export-wrap">
        <label>&nbsp;</label>
        <button class="btn-export" onclick="exportTransactions()">⬇ Export Excel</button>
      </div>
    </div>
  </div>

  <div class="table-card">
    <table class="bills-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Date</th>
          <th>Customer</th>
          <th>Phone</th>
          <th>Type</th>
          <th class="num">Amount</th>
          <th>Reference</th>
        </tr>
      </thead>
      <tbody id="txnBody"></tbody>
    </table>
  </div>

  <div class="footer-back">
    <button class="btn-load-more" id="loadMoreBtn" onclick="loadMore()">Load more</button>
  </div>

</div>

<script src="/static/js/transactions.js"></script>
</body>
</html>
